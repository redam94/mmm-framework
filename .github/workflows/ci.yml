# Continuous integration: lint + fast test suite + coverage + dependency audit.
# (The slow MCMC-fitting tests run nightly, not on every push — see ci-slow.yml.)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + fast tests
    runs-on: ubuntu-latest
    # 60, not 45: the graph-fingerprint matrix (#279 PR 0.1) builds 38 PyMC
    # models, and on a COLD compiledir that is clang time, not test time — the
    # first post-matrix run blew the 45m ceiling that had 21m56s–29m05s of
    # history. The compiledir cache below makes warm runs cheap again; 60 is
    # the cold-cache (cache-miss) budget, moved deliberately per the rule that
    # a too-tight ceiling presents as an infrastructure flake.
    timeout-minutes: 60
    env:
      # coverage.py's PEP 669 core (needs coverage>=7.4 + Python>=3.12; we have
      # 7.13.1 on 3.12.13). Measured on the full fast suite, warm, -n logical:
      #   no coverage   ~120s
      #   default C tracer  217.5s   (x1.81)
      #   COVERAGE_CORE=sysmon  126.6s   (x1.05)
      # Identical report either way (52669 stmts / 12775 missed / 76%), so this
      # buys ~42% of the warm suite for one environment variable.
      # NB mutually exclusive with pytest-testmon: PEP 669's DISABLE return means
      # only the first test to touch a function is recorded, which silently drops
      # most of testmon's dependency edges. We do not use testmon — see the PR
      # body for why change-based selection was measured and rejected here.
      COVERAGE_CORE: sysmon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # The known cost profile of this suite is COMPILATION, not test count
      # (cold PyTensor compiledir measured 4.2x warm). PyTensor validates its
      # own module hashes, so restoring a stale cache is safe — it recompiles
      # exactly what changed. Keyed on uv.lock so a pytensor/pymc bump starts
      # a fresh lineage; restore-keys let same-lineage runs reuse most of it.
      - name: Cache PyTensor compiledir
        uses: actions/cache@v4
        with:
          path: ~/.pytensor
          key: pytensor-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            pytensor-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}
            pytensor-${{ runner.os }}-py312-

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff (lint)
        run: uv run ruff check src server/src

      # Gated as of the one-time reformat. `uv run` (not `uvx`) so the version
      # comes from the lockfile — an unpinned formatter would fail this job on
      # any upstream black release, which is a flaky gate rather than a gate.
      - name: Black (format check)
        run: uv run black --check src server/src tests examples

      - name: Mypy (type-check, non-blocking)
        # Informational on a mostly-untyped tree; ratchet toward a required check.
        continue-on-error: true
        run: uv run mypy src/mmm_framework

      - name: Fast tests + coverage
        # Floor is well below the current ~70% fast-suite coverage; ratchet up.
        #
        # `-n logical`, NOT `-n auto`: xdist resolves "auto" via
        # psutil.cpu_count(logical=False), which is 2 on a 4-vCPU GitHub runner —
        # the run log for #208 says "created: 2/2 workers", i.e. half the runner
        # sat idle. "logical" asks for all 4.
        # If workers start dying unexplained (4 PyMC/PyTensor/JAX processes on
        # 16 GB is not free), that is an OOM: revert this token to `-n 2` rather
        # than chasing a flake.
        run: >
          uv run pytest tests/ -m "not slow" -n logical
          --cov=mmm_framework --cov-report=xml --cov-report=term-missing
          --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Vitest
        run: npm run test

  security-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --group dev

      # Non-blocking for now: surfaces known CVEs in the dependency tree without
      # failing the build. Promote to a required check once the tree is triaged.
      - name: pip-audit
        continue-on-error: true
        run: uv run --with pip-audit pip-audit --strict
